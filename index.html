<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة سحب</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#0d1b2a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#1b263b;
    width:400px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px #00f2ff55;
    color:white;
}

h2{
    text-align:center;
    color:#ff4d4d;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    outline:none;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00cfd5;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
}

.result{
    margin-top:20px;
    background:#243447;
    padding:15px;
    border-radius:15px;
    display:none;
}
.label{
    color:#ccc;
}
.value{
    color:#00f2ff;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

    <h2>بيانات العميل</h2>

    <input type="text" id="name" placeholder="اسم العميل">
    <input type="text" id="number" placeholder="رقم العميل">
    <input type="number" id="fees" placeholder="رسوم الباقة">

    <button onclick="showData()">عرض البيانات</button>

    <div class="result" id="resultBox">
        <h3 style="color:#ff4d4d;">عذراً عملية السحب غير مكتملة</h3>

        <p><span class="label">اسم العميل:</span> 
        <span class="value" id="rName"></span></p>

        <p><span class="label">رقم العميل:</span> 
        <span id="rNumber"></span></p>

        <p><span class="label">رسوم الباقة:</span> 
        <span class="value" id="rFees"></span></p>
    </div>

</div>

<script>
function showData(){

    var name = document.getElementById("name").value;
    var number = document.getElementById("number").value;
    var fees = document.getElementById("fees").value;

    if(name == "" || number == "" || fees == ""){
        alert("من فضلك املأ كل البيانات");
        return;
    }

    document.getElementById("rName").innerText = name;
    document.getElementById("rNumber").innerText = number;
    document.getElementById("rFees").innerText = fees + " ج.م";

    document.getElementById("resultBox").style.display = "block";
}
</script>

</body>
</html>
